kind = "web"
previewPath = "/"
title = "Avalon Resource Hub"
version = "1.0.0"
id = "artifacts/avalon-resource-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22714

[services.development]
run = "pnpm --filter @workspace/avalon-resource-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/avalon-resource-hub", "run", "build" ]
publicDir = "artifacts/avalon-resource-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22714"
BASE_PATH = "/"
